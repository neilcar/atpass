server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content-Security-Policy: scripts only from this origin; 'wasm-unsafe-eval' is
    # for hash-wasm's Argon2id module. Keep in sync with CONTENT_SECURITY_POLICY in
    # vite.config.ts. Repeated in each location because nginx drops server-level
    # add_header directives in any location that sets its own.

    # Hashed filenames (Vite's default) can be cached forever; index.html can't,
    # since it's what points at the current hashed asset names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'" always;
    }
}
