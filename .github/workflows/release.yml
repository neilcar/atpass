name: Build and release CLI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # only the release job needs this, to create the GitHub Release

jobs:
  test:
    strategy:
      matrix:
        # @node-rs/argon2 ships platform-specific native bindings and clipboardy
        # shells out to a different backend per OS, so build+test on all three
        # rather than assuming Linux CI is representative.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/cli/index.js --version
      - run: node dist/cli/index.js --help

  extension-build-check:
    # Builds and lints the Firefox extension on every push/PR too — otherwise
    # a break in extension/ would only surface when someone actually tags a
    # release, in the `release` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run ext:build
      - run: npm run lint --workspace extension

  docker-build-check:
    # Build-only (no push, no Docker Hub credentials needed), so a broken
    # web/Dockerfile is caught on every push/PR instead of only at release
    # time when the `docker` job below actually pushes it. The image is
    # loaded into the local daemon so Grype can scan what was just built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: atpass-web:scan

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      # Report-only: prints every finding (all severities, including ones with
      # no fix yet) as a table and never fails the job. --by-cve reports CVE
      # IDs rather than GHSA/other aliases wherever a CVE exists. To gate
      # builds on severity instead, add e.g. `--fail-on high`.
      - name: Scan image for vulnerabilities (Grype)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: '"$GRYPE" docker:atpass-web:scan --by-cve -o table'

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - run: npm ci

      # --- CLI ---
      - run: npm run build
      - name: Pack CLI tarball
        run: npm pack

      # --- Firefox extension ---
      - name: Sync extension manifest version to package.json
        run: node scripts/sync-extension-version.mjs
      - run: npm run ext:build
      - name: Lint extension (web-ext)
        run: npm run lint --workspace extension
      - name: Package extension
        run: npm run package --workspace extension

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atpass-*.tgz
            extension/web-ext-artifacts/*.zip
          generate_release_notes: true

      # To also publish to the public npm registry:
      #   1. remove "private": true from package.json (npm refuses to publish
      #      a private package, on purpose — that's a deliberate opt-in)
      #   2. add an NPM_TOKEN repo secret (an npm "Automation" token)
      #   3. add a step here: `npm publish --access public`, with
      #      `env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }`, and
      #      `registry-url: https://registry.npmjs.org` on the setup-node step above

      # To submit the extension to addons.mozilla.org instead of (or as well
      # as) attaching the zip here, sign it with `web-ext sign` — see
      # extension/README.md.

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Docker metadata (image tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/atpass-web
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      # Scans the exact image that was just pushed (by digest, so a concurrent
      # push can't change what's scanned), once per platform since the
      # arm64 and amd64 images have different packages. Report-only, same as
      # in docker-build-check: every finding is printed as a CVE table and the
      # job doesn't fail on them. Grype picks up the Docker Hub login above.
      - name: Scan pushed image for vulnerabilities (Grype)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/atpass-web@${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "=== Grype scan: $platform ==="
            "$GRYPE" "registry:$IMAGE" --platform "$platform" --by-cve -o table
          done
