name: Build and release CLI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # only the release job needs this, to create the GitHub Release

jobs:
  test:
    strategy:
      matrix:
        # @node-rs/argon2 ships platform-specific native bindings and clipboardy
        # shells out to a different backend per OS, so build+test on all three
        # rather than assuming Linux CI is representative.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/cli/index.js --version
      - run: node dist/cli/index.js --help

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Pack CLI tarball
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: atpass-*.tgz
          generate_release_notes: true

      # To also publish to the public npm registry:
      #   1. remove "private": true from package.json (npm refuses to publish
      #      a private package, on purpose — that's a deliberate opt-in)
      #   2. add an NPM_TOKEN repo secret (an npm "Automation" token)
      #   3. add a step here: `npm publish --access public`, with
      #      `env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }`, and
      #      `registry-url: https://registry.npmjs.org` on the setup-node step above
