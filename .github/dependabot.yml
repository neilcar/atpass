version: 2
updates:
  # npm workspaces (web, extension) share the root package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Node majors are taken by hand, LTS lines only: Dependabot would
      # otherwise offer odd-numbered releases (e.g. 25), which aren't LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
